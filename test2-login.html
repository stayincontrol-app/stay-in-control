<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="System Control Test 2.0 login"><title>System Control Test 2.0</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(rgba(6,13,35,.35),rgba(6,13,35,.35)),url('./test2-login-house-bg.jpg') center/cover no-repeat fixed,#0f2147;color:#172033;padding:24px 16px}.wrap{width:min(100%,520px);margin:0 auto}.card{background:rgba(255,255,255,.96);border-radius:28px;padding:28px 24px;box-shadow:0 20px 60px rgba(15,23,42,.28)}.brand{margin:0 0 8px;color:#5b21b6;font-weight:900;font-size:1.15rem}.card h1{margin:0 0 8px;font-size:2rem}.intro{color:#64748b;line-height:1.45}.field{margin-top:18px}.field label{display:block;margin-bottom:7px;font-weight:800}.field input,.field select{display:block;width:100%;min-height:56px;padding:12px 14px;border:1px solid #cbd5e1;border-radius:14px;background:#fff;color:#111827;font:inherit;font-size:16px!important}.row{display:grid;grid-template-columns:1fr auto;gap:10px}.row button{min-width:108px}.button{width:100%;min-height:58px;border:0;border-radius:14px;background:linear-gradient(90deg,#4f46e5,#6d28d9);color:#fff;font-size:1rem;font-weight:900;margin-top:22px}.secondary{background:#eef2f7;color:#172033;border:1px solid #cbd5e1;margin-top:10px}.msg{min-height:24px;color:#b42318;font-weight:700;margin:14px 0 0}.note{color:#64748b;font-size:.86rem;line-height:1.45;margin:10px 0 0}@media(min-width:900px){body{display:flex;align-items:center;justify-content:flex-end;padding:40px 7vw}.wrap{margin:0;width:min(520px,42vw)}}@media(max-width:480px){body{padding:18px 14px;background-attachment:scroll}.card{padding:24px 18px;border-radius:24px}.card h1{font-size:1.8rem}}

</head><body><main class="wrap"><section class="card"><p class="brand">System Control Test 2.0</p><h1 id="title">Acessar painel</h1><p class="intro" id="intro">Acesse sua conta para gerenciar suas propriedades.</p><div class="field"><label id="langLabel" for="lang">Idioma / Language</label><select id="lang"><option value="pt-BR">🇧🇷 Português (Brasil)</option><option value="en">🇺🇸 English</option><option value="es">🇪🇸 Español</option><option value="fr">🇫🇷 Français</option><option value="de">🇩🇪 Deutsch</option><option value="it">🇮🇹 Italiano</option><option value="pt-PT">🇵🇹 Português (Portugal)</option><option value="zh-CN">🇨🇳 中文（简体）</option><option value="ja">🇯🇵 日本語</option><option value="ko">🇰🇷 한국어</option></select></div><div class="field" id="modeWrap"><label id="modeLabel" for="mode">Entrar com</label><select id="mode"><option id="emailOpt" value="email">E-mail</option><option value="cpf">CPF</option></select><p class="note" id="cpfNote">CPF + senha disponível somente para proprietários no Brasil.</p></div><form id="loginForm"><div class="field"><label id="idLabel" for="identifier">E-mail</label><input id="identifier" type="email" autocomplete="email" required></div><div class="field"><label id="passwordLabel" for="password">Senha</label><div class="row"><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="show" class="button secondary" type="button" style="margin-top:0">Mostrar</button></div></div><button id="submit" class="button" type="submit">Entrar</button></form><button id="forgot" class="button secondary" type="button">Esqueci minha senha</button><p id="msg" class="msg" role="alert"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const URL='https://cwtpeabebkoveachrclo.supabase.co',KEY='sb_publishable_XJszvSVg7p7QF4jSdDeiGw_jOvtNlgR',AUTH='ap207-auth-profile-v1',ACT='stay-control-last-activity-v1',SUITE='system-control-test2-suite-v1';const T={'pt-BR':{title:'Acessar painel',intro:'Acesse sua conta para gerenciar suas propriedades.',lang:'Idioma / Language',mode:'Entrar com',note:'CPF + senha disponível somente para proprietários no Brasil.',email:'E-mail',password:'Senha',show:'Mostrar',hide:'Ocultar',enter:'Entrar',forgot:'Esqueci minha senha',entering:'Entrando…',bad:'E-mail ou senha inválidos.',send:'Digite seu e-mail primeiro.',sending:'Enviando e-mail…',sent:'E-mail enviado. Abra o link para criar uma nova senha.'},en:{title:'Sign in',intro:'Access your account to manage your properties.',lang:'Language',mode:'Sign in with',note:'CPF + password is available only to property owners in Brazil.',email:'Email',password:'Password',show:'Show',hide:'Hide',enter:'Sign in',forgot:'Forgot my password',entering:'Signing in…',bad:'Invalid email or password.',send:'Enter your email first.',sending:'Sending email…',sent:'Email sent. Open the link to create a new password.'},es:{title:'Acceder al panel',intro:'Accede a tu cuenta para gestionar tus propiedades.',lang:'Idioma',mode:'Entrar con',note:'CPF + contraseña disponible solo para propietarios en Brasil.',email:'Correo electrónico',password:'Contraseña',show:'Mostrar',hide:'Ocultar',enter:'Entrar',forgot:'Olvidé mi contraseña',entering:'Entrando…',bad:'Correo o contraseña no válidos.',send:'Ingresa tu correo primero.',sending:'Enviando correo…',sent:'Correo enviado. Abre el enlace para crear una nueva contraseña.'}};const client=supabase.createClient(URL,KEY),form=document.getElementById('loginForm'),lang=document.getElementById('lang'),mode=document.getElementById('mode'),modeWrap=document.getElementById('modeWrap'),id=document.getElementById('identifier'),idLabel=document.getElementById('idLabel'),pwd=document.getElementById('password'),msg=document.getElementById('msg'),show=document.getElementById('show'),forgot=document.getElementById('forgot');const tx=()=>T[lang.value]||T.en;function digits(v){return String(v||'').replace(/\D/g,'')}function validCpf(v){const s=digits(v);if(s.length!==11||/^(\d)\1{10}$/.test(s))return false;const calc=n=>{let sum=0;for(let i=0;i<n;i++)sum+=Number(s[i])*(n+1-i);const r=(sum*10)%11;return(r===10?0:r)===Number(s[n])};return calc(9)&&calc(10)}function saveLang(){let s={};try{s=JSON.parse(localStorage.getItem(SUITE)||'{}')||{}}catch{}s.language=lang.value;localStorage.setItem(SUITE,JSON.stringify(s));document.documentElement.lang=lang.value}function paint(){const t=tx();document.getElementById('title').textContent=t.title;document.getElementById('intro').textContent=t.intro;document.getElementById('langLabel').textContent=t.lang;document.getElementById('modeLabel').textContent=t.mode;document.getElementById('cpfNote').textContent=t.note;document.getElementById('emailOpt').textContent=t.email;document.getElementById('passwordLabel').textContent=t.password;document.getElementById('submit').textContent=t.enter;forgot.textContent=t.forgot;show.textContent=pwd.type==='text'?t.hide:t.show}function refresh(){saveLang();modeWrap.hidden=lang.value!=='pt-BR';if(lang.value!=='pt-BR')mode.value='email';const cpf=mode.value==='cpf'&&lang.value==='pt-BR';idLabel.textContent=cpf?'CPF':tx().email;id.type=cpf?'text':'email';id.inputMode=cpf?'numeric':'email';id.placeholder=cpf?'000.000.000-00':'';id.autocomplete=cpf?'username':'email';id.value='';paint()}async function profile(user){const{data:p,error}=await client.from('profiles').select('id,email,name,role,active').eq('id',user.id).single();if(error)throw error;if(!p?.active)throw new Error('Inactive');let propertyIds=[];if(p.role!=='super_admin'){const{data:rows,error:e}=await client.from('property_access').select('property_id').eq('user_id',user.id);if(e)throw e;propertyIds=(rows||[]).map(r=>r.property_id)}localStorage.setItem(AUTH,JSON.stringify({profile:p,propertyIds}));localStorage.setItem(ACT,String(Date.now()))}async function emailLogin(){const{data,error}=await client.auth.signInWithPassword({email:id.value.trim(),password:pwd.value});if(error)throw error;await profile(data.user)}async function cpfLogin(){const cpf=digits(id.value);if(!validCpf(cpf))throw new Error('CPF');const{data,error}=await client.functions.invoke('cpf-owner-access',{body:{action:'login',cpf,password:pwd.value}});if(error||!data?.ok||!data?.access_token||!data?.refresh_token)throw new Error('CPF');const{error:setError}=await client.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(setError)throw setError;const{data:{user}}=await client.auth.getUser();await profile(user)}lang.addEventListener('change',refresh);mode.addEventListener('change',refresh);show.addEventListener('click',()=>{pwd.type=pwd.type==='text'?'password':'text';paint()});form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent=tx().entering;try{if(pwd.value.length<6)throw new Error('password');if(mode.value==='cpf'&&lang.value==='pt-BR')await cpfLogin();else await emailLogin();location.replace('./')}catch(err){msg.textContent=mode.value==='cpf'?'CPF ou senha inválidos.':tx().bad}});forgot.addEventListener('click',async()=>{if(mode.value==='cpf'&&lang.value==='pt-BR'){msg.textContent='Para recuperar acesso por CPF, fale com a Central de Atendimento pelo WhatsApp +1 (561) 275-6810.';return}const email=id.value.trim();if(!email){msg.textContent=tx().send;id.focus();return}msg.textContent=tx().sending;const{error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace(/test2-login\.html$/,'')+'?type=recovery'});msg.textContent=error?tx().bad:tx().sent});(async()=>{try{const{data:{session}}=await client.auth.getSession();if(session?.user){await profile(session.user);location.replace('./');return}}catch{}try{const s=JSON.parse(localStorage.getItem(SUITE)||'{}');if(s?.language)lang.value=s.language}catch{}refresh()})()})();</script></body></html>
