<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stay in Control 1.0 — Primeiro acesso</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}.card{width:min(100%,430px);background:#fff;border-radius:22px;padding:26px;box-shadow:0 18px 55px rgba(20,35,60,.16)}.brand{margin:0 0 4px;font-weight:800;color:#2563eb}.card h1{margin:0 0 6px;font-size:28px}.card p{color:#64748b;line-height:1.45}.card label{display:block;margin:15px 0 6px;font-size:13px;font-weight:700}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.card input{width:100%;padding:13px 14px;border:1px solid #d7dee8;border-radius:12px;font-size:16px}.show{padding:0 14px;border:1px solid #d7dee8;border-radius:12px;font-weight:800}.save,.back{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px 16px;font-weight:800}.save{background:#2563eb;color:#fff}.back{display:block;background:#111827;color:#fff;text-decoration:none;text-align:center}.message{min-height:22px;margin-top:12px;color:#b42318}.success{color:#166534!important}.email{padding:11px 12px;border-radius:12px;background:#ecfdf3;color:#166534!important}.hidden{display:none!important}</style></head><body><section class="card"><p class="brand">Stay in Control 1.0</p><h1>Crie sua senha</h1><p>Defina a nova senha que você usará para entrar no aplicativo.</p><p id="emailNote" class="email hidden"></p><form id="passwordForm" class="hidden"><label>Nova senha</label><div class="row"><input id="password" type="password" minlength="6" required><button class="show" id="show1" type="button">Mostrar</button></div><label>Confirmar nova senha</label><div class="row"><input id="confirm" type="password" minlength="6" required><button class="show" id="show2" type="button">Mostrar</button></div><button class="save" id="saveButton" type="submit">Salvar nova senha</button></form><p id="message" class="message">Validando seu acesso…</p><a id="backToApp" class="back" href="#">Voltar para o Stay in Control</a></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const U='https://cwtpeabebkoveachrclo.supabase.co',K='sb_publishable_XJszvSVg7p7QF4jSdDeiGw_jOvtNlgR',APP='https://raw.githack.com/marcelinhone-code/Ap207-dashboard-/visual-share-working-20260818/index.html';const f=document.getElementById('passwordForm'),p=document.getElementById('password'),c=document.getElementById('confirm'),m=document.getElementById('message'),eNote=document.getElementById('emailNote'),btn=document.getElementById('saveButton');document.getElementById('backToApp').href=APP+'?from=invite';const tog=(i,b)=>b.onclick=()=>{i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Mostrar':'Ocultar'};tog(p,show1);tog(c,show2);const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function session(cl){let s=(await cl.auth.getSession()).data.session;if(s?.user)return s;const q=new URLSearchParams(location.search),code=q.get('code');if(code){const x=await cl.auth.exchangeCodeForSession(code);if(!x.error&&x.data.session)return x.data.session}const h=new URLSearchParams(location.hash.replace(/^#/,'')),a=h.get('access_token'),r=h.get('refresh_token');if(a&&r){const x=await cl.auth.setSession({access_token:a,refresh_token:r});if(!x.error&&x.data.session)return x.data.session}for(let i=0;i<12;i++){await sleep(250);s=(await cl.auth.getSession()).data.session;if(s?.user)return s}return null}async function boot(){try{const cl=window.supabase.createClient(U,K,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});const s=await session(cl);if(!s?.user){m.textContent='Este link já foi usado ou expirou. Abrindo a tela de acesso…';setTimeout(()=>location.replace(APP+'?from=old-link'),1200);return}eNote.textContent=s.user.email||'E-mail confirmado';eNote.classList.remove('hidden');f.classList.remove('hidden');m.textContent='';f.onsubmit=async ev=>{ev.preventDefault();if(p.value.length<6){m.textContent='A senha precisa ter pelo menos 6 caracteres.';return}if(p.value!==c.value){m.textContent='As duas senhas precisam ser iguais.';return}btn.disabled=true;m.className='message';m.textContent='Confirmando a mudança da senha…';const changed=await cl.auth.updateUser({password:p.value});if(changed.error){btn.disabled=false;m.textContent=changed.error.message||'A senha não foi alterada. A senha anterior continua válida.';return}const verify=await cl.auth.getUser();if(verify.error||!verify.data.user){btn.disabled=false;m.textContent='Não foi possível confirmar a alteração. Tente novamente.';return}m.className='message success';m.textContent='✅ Nova senha confirmada. A senha anterior foi invalidada.';try{await cl.auth.signOut({scope:'others'})}catch{}setTimeout(()=>location.replace(APP+'?password=changed'),900)}}catch{m.textContent='Abrindo a tela atual de acesso…';setTimeout(()=>location.replace(APP+'?from=old-link'),1000)}}boot()})();</script></body></html>
