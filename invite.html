<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stay in Control 1.0 — primeiro acesso">
  <title>Stay in Control 1.0 — Primeiro acesso</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}.card{width:min(100%,430px);background:#fff;border-radius:22px;padding:26px;box-shadow:0 18px 55px rgba(20,35,60,.16)}.brand{margin:0 0 4px;font-weight:800;color:#2563eb}.card h1{margin:0 0 6px;font-size:28px}.card p{color:#64748b;line-height:1.45}.card label{display:block;margin:15px 0 6px;font-size:13px;font-weight:700;color:#334155}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.card input{width:100%;padding:13px 14px;border:1px solid #d7dee8;border-radius:12px;font-size:16px}.show{min-height:48px;padding:0 14px;border:1px solid #d7dee8;border-radius:12px;background:#eef2f7;font-weight:800}.save,.back{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:800}.save{background:#2563eb;color:#fff}.back{display:block;background:#111827;color:#fff;text-decoration:none;text-align:center}.message{min-height:22px;margin-top:12px;font-size:14px;color:#b42318}.success{color:#166534!important}.email{padding:11px 12px;border-radius:12px;background:#ecfdf3;color:#166534!important;font-size:13px}.hidden{display:none!important}
  </style>
</head>
<body>
  <section class="card">
    <p class="brand">Stay in Control 1.0</p>
    <h1>Crie sua senha</h1>
    <p>Este é o seu primeiro acesso. Defina a senha que você usará para entrar no aplicativo.</p>
    <p id="emailNote" class="email hidden"></p>
    <form id="passwordForm" class="hidden">
      <label for="password">Nova senha</label>
      <div class="row"><input id="password" type="password" minlength="6" autocomplete="new-password" required><button class="show" id="show1" type="button">Mostrar</button></div>
      <label for="confirm">Confirmar nova senha</label>
      <div class="row"><input id="confirm" type="password" minlength="6" autocomplete="new-password" required><button class="show" id="show2" type="button">Mostrar</button></div>
      <button class="save" id="saveButton" type="submit">Salvar senha e entrar</button>
    </form>
    <p id="message" class="message">Validando seu acesso…</p>
    <a id="backToApp" class="back" href="https://raw.githack.com/marcelinhone-code/Ap207-dashboard-/visual-share-working-20260818/index.html">Voltar para o Stay in Control</a>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (()=>{
      'use strict';
      const SUPABASE_URL='https://cwtpeabebkoveachrclo.supabase.co';
      const SUPABASE_KEY='sb_publishable_XJszvSVg7p7QF4jSdDeiGw_jOvtNlgR';
      const APP_URL='https://raw.githack.com/marcelinhone-code/Ap207-dashboard-/visual-share-working-20260818/index.html';
      const form=document.getElementById('passwordForm'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),message=document.getElementById('message'),emailNote=document.getElementById('emailNote'),saveButton=document.getElementById('saveButton');
      document.getElementById('backToApp').href=APP_URL+'?from=invite';
      const toggle=(input,button)=>button.addEventListener('click',()=>{const visible=input.type==='text';input.type=visible?'password':'text';button.textContent=visible?'Mostrar':'Ocultar'});
      toggle(password,document.getElementById('show1'));toggle(confirm,document.getElementById('show2'));
      const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
      async function resolveSession(client){
        let session=(await client.auth.getSession()).data.session;
        if(session?.user)return session;
        const q=new URLSearchParams(location.search||'');
        const code=q.get('code');
        if(code&&client.auth.exchangeCodeForSession){const exchanged=await client.auth.exchangeCodeForSession(code);if(!exchanged.error&&exchanged.data.session)return exchanged.data.session;}
        const hash=new URLSearchParams((location.hash||'').replace(/^#/,''));
        const access_token=hash.get('access_token'),refresh_token=hash.get('refresh_token');
        if(access_token&&refresh_token){const set=await client.auth.setSession({access_token,refresh_token});if(!set.error&&set.data.session)return set.data.session;}
        for(let i=0;i<12;i++){await sleep(250);session=(await client.auth.getSession()).data.session;if(session?.user)return session;}
        return null;
      }
      async function boot(){
        try{
          const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
          window.AP207Supabase=client;
          const session=await resolveSession(client);
          if(!session?.user){
            message.textContent='Este link já foi usado, expirou ou não precisa mais ser validado. Abrindo a tela atual de acesso…';
            setTimeout(()=>location.replace(APP_URL+'?from=old-link'),1200);
            return;
          }
          try{history.replaceState(null,'',location.pathname+'?validated=1')}catch{}
          emailNote.textContent=session.user.email||'E-mail confirmado';emailNote.classList.remove('hidden');form.classList.remove('hidden');message.textContent='';
          form.addEventListener('submit',async(e)=>{
            e.preventDefault();
            if(password.value.length<6){message.textContent='A senha precisa ter pelo menos 6 caracteres.';return;}
            if(password.value!==confirm.value){message.textContent='As duas senhas precisam ser iguais.';return;}
            saveButton.disabled=true;message.textContent='Salvando sua senha…';
            const {error}=await client.auth.updateUser({password:password.value});
            if(error){saveButton.disabled=false;message.textContent=error.message||'Não foi possível salvar a senha.';return;}
            message.classList.add('success');message.textContent='✅ Senha criada com sucesso. Abrindo o aplicativo…';
            setTimeout(()=>location.replace(APP_URL+'?from=invite'),500);
          });
        }catch(err){
          message.textContent='Abrindo a tela atual de acesso…';
          setTimeout(()=>location.replace(APP_URL+'?from=old-link'),1000);
        }
      }
      boot();
    })();
  </script>
</body>
</html>
