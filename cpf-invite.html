<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Primeiro acesso por CPF</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#07152f;display:grid;place-items:center;padding:20px;color:#172033}.card{width:min(100%,520px);background:#fff;border-radius:26px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.35)}.brand{color:#5b21b6;font-weight:900;margin:0 0 8px}.card h1{margin:0 0 8px}.intro{color:#64748b;line-height:1.5}.field{margin-top:18px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;min-height:56px;border:1px solid #cbd5e1;border-radius:13px;padding:12px 14px;font:inherit;font-size:16px}.button{width:100%;min-height:56px;border:0;border-radius:13px;background:linear-gradient(90deg,#4f46e5,#6d28d9);color:#fff;font-weight:900;font-size:1rem;margin-top:20px}.button:disabled{opacity:.6}.msg{min-height:24px;font-weight:700;margin-top:14px}.bad{color:#b42318}.ok{color:#166534}.note{font-size:.88rem;color:#64748b;line-height:1.45}@media(max-width:480px){.card{padding:24px 18px;border-radius:22px}}</style></head><body><main class="card"><p class="brand">Stay in Control</p><h1>Criar sua senha</h1><p class="intro" id="intro">Validando seu link de primeiro acesso…</p><form id="form" hidden><div class="field"><label for="password">Crie uma senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm">Confirme a senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><p class="note">Use pelo menos 8 caracteres. Depois disso, seus próximos acessos serão com CPF + senha.</p><button id="submit" class="button" type="submit">Criar senha e entrar</button></form><p id="msg" class="msg" role="alert"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{'use strict';const URL='https://cwtpeabebkoveachrclo.supabase.co',KEY='sb_publishable_XJszvSVg7p7QF4jSdDeiGw_jOvtNlgR';const client=supabase.createClient(URL,KEY),token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('form'),intro=document.getElementById('intro'),msg=document.getElementById('msg'),submit=document.getElementById('submit');async function invoke(body){const {data,error}=await client.functions.invoke('cpf-owner-access',{body});if(error||!data?.ok)throw new Error(data?.error||error?.message||'Não foi possível concluir.');return data}async function init(){if(token.length<40){intro.textContent='Este link é inválido.';msg.className='msg bad';msg.textContent='Peça um novo link de acesso ao administrador.';return}try{const data=await invoke({action:'invite_info',token});intro.textContent=`Olá${data.name?' '+data.name:''}. Crie sua senha para ativar o acesso por CPF.`;form.hidden=false}catch(e){intro.textContent='Este link não pode mais ser usado.';msg.className='msg bad';msg.textContent=e.message||'Peça um novo link ao administrador.'}}form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){msg.className='msg bad';msg.textContent='A senha deve ter pelo menos 8 caracteres.';return}if(p!==c){msg.className='msg bad';msg.textContent='As senhas não coincidem.';return}submit.disabled=true;submit.textContent='Criando acesso…';msg.textContent='';try{const data=await invoke({action:'activate_invite',token,password:p});await client.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});history.replaceState(null,'',location.pathname);msg.className='msg ok';msg.textContent='Acesso ativado. Entrando…';location.replace('./index.html')}catch(e){msg.className='msg bad';msg.textContent=e.message||'Não foi possível ativar o acesso.';submit.disabled=false;submit.textContent='Criar senha e entrar'}});init()})();</script></body></html>
